name: Feature request
description: Suggest something that would help your chef business.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in your work this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Platebook to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
